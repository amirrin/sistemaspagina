<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto | Playeras y Gorras</title>
    <meta name="description" content="Dirección y teléfono de Playeras y Gorras en Puebla.">
    <link rel="stylesheet" href="main.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header class="header">
        <div class="header-inner">
            <a class="logo" href="index.html">Playeras y Gorras</a>
            <nav class="nav" aria-label="Principal">
                <a class="nav-hide-sm" href="index.html">Tienda</a>
                <button type="button" class="cart-btn" data-open-cart aria-label="Abrir carrito">
                    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/>
                    </svg>
                    <span>Carrito</span>
                    <span class="cart-count" hidden>0</span>
                </button>
            </nav>
        </div>
    </header>

    <main>
        <section class="contact">
            <h1>Contacto</h1>

            <dl class="contact-info">
                <dt>Dirección</dt>
                <dd>Av. 4 Pte. 1919, San Matías, 72140 Heroica Puebla de Zaragoza, Pue.</dd>

                <dt>Número</dt>
                <dd><a href="tel:22312511">22312511</a></dd>
            </dl>
        </section>

        <section class="map" aria-label="Mapa">
            <iframe
                src="https://maps.google.com/maps?q=Av.%204%20Pte.%201919%2C%20San%20Mat%C3%ADas%2C%2072140%20Puebla%2C%20Pue.&z=16&output=embed"
                title="Mapa de Av. 4 Pte. 1919, San Matías, Puebla"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen></iframe>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span>&copy; 2026 Playeras y Gorras · Tienda de demostración</span>
            <span>Fotos: <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a></span>
        </div>
    </footer>

</body>
</html>
